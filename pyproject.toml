[project]
name = "amp-challenge"
version = "0.1.0"
description = "AMPGen submission for the AMP Challenge: two-stage generative AMP design pipeline"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "torch",
    "transformers>=4.40",
    "peft>=0.11",
    "pandas",
    "numpy",
    "scipy",
    "Levenshtein",
]

[project.scripts]
generate = "ampgen.generate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ampgen"]
